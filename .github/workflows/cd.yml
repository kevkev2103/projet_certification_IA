# Workflow CD - Livraison Continue (C19)

name: CD - Livraison Continue

# Quand déclencher le déploiement
on:
  push:
    branches: [ main ]  # Seulement sur la branche main
  release:
    types: [ created ]

# Les jobs à exécuter
jobs:
  build-and-deploy:
    # OS à utiliser
    runs-on: ubuntu-latest
    
    steps:
    # 1. Récupérer le code
    - name: Récupérer le code
      uses: actions/checkout@v4
    
    # 2. Setup Docker Buildx
    - name: Setup Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    # 3. Build de l'API CRUD
    - name: Build API CRUD
      run: |
        echo "🔨 Build de l'API CRUD..."
        docker build -t cinapps-api:latest ./cinapps_api
        echo "✅ API CRUD buildée"
    
    # 4. Build de l'app Streamlit
    - name: Build Streamlit App
      run: |
        echo "🔨 Build de l'app Streamlit..."
        docker build -t streamlit-app:latest ./streamlit
        echo "✅ Streamlit buildée"
    
    # 5. Build du Pipeline de prédiction
    - name: Build Pipeline de prédiction
      run: |
        echo "🔨 Build du pipeline de prédiction..."
        docker build -t prediction-pipeline:latest -f Dockerfile.pipeline .
        echo "✅ Pipeline buildé"
    
    # 6. Test des images Docker
    - name: Test des images Docker
      run: |
        echo "🧪 Test des images Docker..."
        docker images
        echo "✅ Images créées avec succès"
    
    # 7. Tag des versions (simulation)
    - name: Tag des versions
      run: |
        echo "🏷️ Tag des versions..."
        VERSION=$(date +%Y%m%d-%H%M%S)
        docker tag cinapps-api:latest cinapps-api:$VERSION
        docker tag streamlit-app:latest streamlit-app:$VERSION
        docker tag prediction-pipeline:latest prediction-pipeline:$VERSION
        echo "✅ Images taguées avec version: $VERSION"
    
    # 8. Simulation Push vers Registry
    - name: Simulation Push Registry
      run: |
        echo "📦 Simulation push vers registry..."
        echo "- cinapps-api:latest → registry.example.com/cinapps-api:latest"
        echo "- streamlit-app:latest → registry.example.com/streamlit-app:latest"
        echo "- prediction-pipeline:latest → registry.example.com/prediction-pipeline:latest"
        echo "✅ Push simulé vers registry"
    
    # 9. Simulation Déploiement
    - name: Simulation Déploiement
      run: |
        echo "🚀 Simulation déploiement..."
        echo "1. Arrêt des anciens conteneurs"
        echo "2. Démarrage des nouveaux conteneurs"
        echo "3. Tests de santé"
        echo "4. Mise à jour du load balancer"
        echo "✅ Déploiement simulé terminé"
    
    # 10. Nettoyage
    - name: Nettoyage
      run: |
        echo "🧹 Nettoyage des images temporaires..."
        docker system prune -f
        echo "✅ Nettoyage terminé"
    
    # 11. Résultat final
    - name: Résultat du déploiement
      run: |
        echo "🎉 DÉPLOIEMENT RÉUSSI !"
        echo "📋 Résumé:"
        echo "  - API CRUD: ✅ Déployée"
        echo "  - Streamlit: ✅ Déployée"
        echo "  - Pipeline ML: ✅ Déployé"
        echo "  - Version: $(date +%Y%m%d-%H%M%S)"