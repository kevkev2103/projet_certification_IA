# Workflow CI - Tests automatiques (C18)

name: CI - Tests Automatiques

# Quand lancer les tests
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

# Les jobs à exécuter
jobs:
  tests:
    # OS à utiliser
    runs-on: ubuntu-latest
    
    steps:
    # 1. Récupérer le code
    - name: Récupérer le code
      uses: actions/checkout@v4
    
    # 2. Installer Python
    - name: Installer Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    # 3. Cache des dépendances (plus rapide)
    - name: Cache pip
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: pip-${{ hashFiles('**/requirements*.txt') }}
    
    # 4. Installer les dépendances
    - name: Installer les dépendances
      run: |
        python -m pip install --upgrade pip
        pip install -r tests/requirements-test.txt
    
    # 5. Lancer les tests
    - name: Lancer les tests
      run: |
        echo "🧪 Lancement des tests..."
        pytest --version
        pytest -v --tb=short
      continue-on-error: true  # Ne pas faire échouer si tests échouent
    
    # 6. Tests avec coverage (bonus)
    - name: Tests avec coverage
      run: |
        echo "📊 Tests avec coverage..."
        pytest --cov=cinapps_api --cov-report=term-missing
      continue-on-error: true
    
    # 7. Afficher le résultat
    - name: Résultat
      run: |
        echo "✅ Workflow CI terminé !"
        echo "📋 Les tests ont été exécutés"