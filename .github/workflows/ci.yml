name: CI - Tests et Qualité

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: [3.10.12]
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: motdepasseadmin
          MYSQL_DATABASE: cinapps
          MYSQL_USER: kevin
          MYSQL_PASSWORD: kevinpass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install test dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r tests/requirements.txt
    
    - name: Set up environment variables
      run: |
        echo "MYSQL_HOST=localhost" >> $GITHUB_ENV
        echo "MYSQL_USER=kevin" >> $GITHUB_ENV
        echo "MYSQL_PASSWORD=kevinpass" >> $GITHUB_ENV
        echo "MYSQL_DATABASE=cinapps" >> $GITHUB_ENV
        echo "API_URL_CRUD=http://localhost:8000" >> $GITHUB_ENV
        echo "API_URL_PREDICTION=http://localhost:8000" >> $GITHUB_ENV
        echo "STREAMLIT_URL=http://localhost:8501" >> $GITHUB_ENV
    
    - name: Wait for MySQL to be ready
      run: |
        until mysqladmin ping -h localhost -u kevin -pkevinpass; do
          echo "Waiting for MySQL..."
          sleep 5
        done
    
    - name: Run project structure tests
      run: |
        cd tests
        python -m pytest test_docker_setup.py -v --tb=short
    
    - name: Run prediction pipeline tests
      run: |
        cd tests
        python -m pytest test_prediction_pipeline.py -v --tb=short
    
    - name: Install project dependencies for API tests
      run: |
        pip install -r cinapps_api/requirements.txt
        pip install -r API_s/requirements.txt
    
    - name: Start API services for testing
      run: |
        # Démarrer l'API CRUD en arrière-plan
        cd cinapps_api
        python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 &
        API_PID=$!
        echo "API_PID=$API_PID" >> $GITHUB_ENV
        
        # Attendre que l'API soit prête
        sleep 10
        curl -f http://localhost:8000/health || exit 1
    
    - name: Run API tests
      run: |
        cd tests
        python -m pytest test_api_crud.py -v --tb=short
    
    - name: Run Streamlit configuration tests
      run: |
        cd tests
        python -m pytest test_streamlit.py::TestStreamlitConfiguration -v --tb=short
    
    - name: Stop services
      if: always()
      run: |
        if [ ! -z "$API_PID" ]; then
          kill $API_PID || true
        fi
    
    - name: Generate coverage report
      run: |
        cd tests
        python -m pytest --cov=../ --cov-report=xml --cov-report=html
    
    - name: Upload coverage to artifacts
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: tests/htmlcov/

  lint:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: 3.10.12
    
    - name: Install linting tools
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black isort
    
    - name: Run black (code formatting check)
      run: |
        black --check --diff .
      continue-on-error: true
    
    - name: Run isort (import sorting check)
      run: |
        isort --check-only --diff .
      continue-on-error: true
    
    - name: Run flake8 (linting)
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=88 --statistics
      continue-on-error: true