# Workflow CI - Tests automatiques (C18)

name: CI - Tests Automatiques

# Quand lancer les tests
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

# Les jobs à exécuter
jobs:
  tests:
    # OS à utiliser
    runs-on: ubuntu-latest
    
    steps:
    # 1. Récupérer le code
    - name: Récupérer le code
      uses: actions/checkout@v4
    
    # 2. Installer Python
    - name: Installer Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    # 3. Cache des dépendances (plus rapide)
    - name: Cache pip
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: pip-${{ hashFiles('**/requirements*.txt') }}
    
    # 4. Installer les dépendances
    - name: Installer les dépendances
      run: |
        python -m pip install --upgrade pip
        pip install -r tests/requirements-test.txt
    
    # 5. Variables d'environnement pour SQLite
    - name: Setup variables de test
      run: |
        echo "DATABASE_URL=sqlite:///test_cinapps.db" >> $GITHUB_ENV
        echo "GITHUB_ACTIONS=true" >> $GITHUB_ENV
        echo "SECRET_KEY=test_secret_key_for_ci" >> $GITHUB_ENV
        echo "ALGORITHM=HS256" >> $GITHUB_ENV
    
    # 6. Installer dépendances API (vraies dépendances)
    - name: Installer dépendances API
      run: |
        echo "📦 Installation dépendances API..."
        pip install -r cinapps_api/requirements.txt
    
    # 7. Créer fichier .env pour l'API
    - name: Créer configuration .env
      run: |
        echo "📝 Création du fichier .env pour l'API..."
        cd cinapps_api
        echo "DATABASE_URL=sqlite:///test_cinapps.db" > .env
        echo "SECRET_KEY=test_secret_key_for_ci" >> .env
        echo "ALGORITHM=HS256" >> .env
        echo "ACCESS_TOKEN_EXPIRE_MINUTES=30" >> .env
    
    # 8. Lancer l'API en arrière-plan
    - name: Lancer l'API en arrière-plan
      run: |
        echo "🚀 Lancement de l'API en arrière-plan..."
        cd cinapps_api
        nohup python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 > api.log 2>&1 &
        echo "⏳ Attente démarrage API..."
        sleep 20
        echo "📋 Logs de l'API:"
        cat api.log || echo "Pas de logs trouvés"
        echo "✅ Tentative de démarrage terminée"
    
    # 9. Vérifier que l'API répond
    - name: Test API démarrée
      run: |
        echo "🔍 Vérification API..."
        curl -f http://localhost:8000/ || echo "API pas encore prête"
        echo "🔍 Test endpoint health..."
        curl -f http://localhost:8000/health || echo "Health check failed"
        sleep 5
    
    # 9.2. Insérer utilisateur test après création tables par API
    - name: Insérer utilisateur de test
      run: |
        echo "👤 Insertion utilisateur de test..."
        python -c "
import sys
sys.path.append('tests')
from database_test import insert_test_user
insert_test_user()
"
    
    # 9.5. Debug complet avant tests
    - name: Debug configuration
      run: |
        echo "🔍 === DEBUG CONFIGURATION ==="
        echo "📂 Répertoire actuel:"
        pwd
        ls -la
        
        echo "📋 Variables d'environnement:"
        env | grep -E "(DATABASE|GITHUB|SECRET)" || echo "Aucune variable trouvée"
        
        echo "📁 Fichier .env de l'API:"
        cat cinapps_api/.env || echo "Fichier .env introuvable"
        
        echo "🗃️ Base SQLite:"
        ls -la test_cinapps.db || echo "Base SQLite introuvable"
        
        echo "👤 Utilisateurs dans la base:"
        sqlite3 test_cinapps.db "SELECT username FROM main_user;" || echo "Erreur lecture base"
        
        echo "📋 Tables dans la base:"
        sqlite3 test_cinapps.db ".tables" || echo "Erreur liste tables"
        
        echo "📋 Structure table main_user:"
        sqlite3 test_cinapps.db ".schema main_user" || echo "Table main_user introuvable"
        
        echo "📋 Logs API:"
        cd cinapps_api
        tail -20 api.log || echo "Pas de logs API"
        
        echo "🌐 Test auth manuel:"
        curl -X POST "http://localhost:8000/auth/token" \
          -H "Content-Type: application/x-www-form-urlencoded" \
          -d "username=testuser&password=test123" || echo "Test auth échoué"
    
    # 10. Lancer les tests
    - name: Lancer les tests
      run: |
        echo "🧪 Lancement des tests avec SQLite..."
        pytest --version
        pytest -v --tb=short
      # continue-on-error: true  
    
    # 11. Tests avec coverage (bonus)
    - name: Tests avec coverage
      run: |
        echo "📊 Tests avec coverage..."
        pytest --cov=tests --cov-report=term-missing
      continue-on-error: true
    
    # 12. Afficher le résultat
    - name: Résultat
      run: |
        echo "✅ Workflow CI terminé !"
        echo "📋 Les tests ont été exécutés avec SQLite"
        echo "🗃️ Base de test: SQLite temporaire"