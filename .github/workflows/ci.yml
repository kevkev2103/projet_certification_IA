# Workflow CI - Tests automatiques (C18)

name: CI - Tests Automatiques

# Quand lancer les tests
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

# Les jobs à exécuter
jobs:
  tests:
    # OS à utiliser
    runs-on: ubuntu-latest
    
    steps:
    # 1. Récupérer le code
    - name: Récupérer le code
      uses: actions/checkout@v4
    
    # 2. Installer Python
    - name: Installer Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    # 3. Cache des dépendances (plus rapide)
    - name: Cache pip
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: pip-${{ hashFiles('**/requirements*.txt') }}
    
    # 4. Installer les dépendances
    - name: Installer les dépendances
      run: |
        python -m pip install --upgrade pip
        pip install -r tests/requirements-test.txt
    
    # 5. Variables d'environnement pour SQLite
    - name: Setup variables de test
      run: |
        echo "DATABASE_URL=sqlite:///test_cinapps.db" >> $GITHUB_ENV
        echo "GITHUB_ACTIONS=true" >> $GITHUB_ENV
        echo "SECRET_KEY=test_secret_key_for_ci" >> $GITHUB_ENV
        echo "ALGORITHM=HS256" >> $GITHUB_ENV
    
    # 6. Installer dépendances API
    - name: Installer dépendances API
      run: |
        echo "📦 Installation dépendances API..."
        pip install fastapi uvicorn sqlmodel pymysql python-multipart python-jose[cryptography] passlib[bcrypt]
    
    # 7. Lancer l'API en arrière-plan
    - name: Lancer l'API en arrière-plan
      run: |
        echo "🚀 Lancement de l'API en arrière-plan..."
        cd cinapps_api
        nohup python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 &
        echo "⏳ Attente démarrage API..."
        sleep 15
        echo "✅ API démarrée"
    
    # 8. Vérifier que l'API répond
    - name: Test API démarrée
      run: |
        echo "🔍 Vérification API..."
        curl -f http://localhost:8000/docs || echo "API pas encore prête"
        sleep 5
    
    # 9. Lancer les tests
    - name: Lancer les tests
      run: |
        echo "🧪 Lancement des tests avec SQLite..."
        pytest --version
        pytest -v --tb=short
      continue-on-error: true  
    
    # 10. Tests avec coverage (bonus)
    - name: Tests avec coverage
      run: |
        echo "📊 Tests avec coverage..."
        pytest --cov=tests --cov-report=term-missing
      continue-on-error: true
    
    # 11. Afficher le résultat
    - name: Résultat
      run: |
        echo "✅ Workflow CI terminé !"
        echo "📋 Les tests ont été exécutés avec SQLite"
        echo "🗃️ Base de test: SQLite temporaire"